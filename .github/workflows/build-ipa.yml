name: Build DEV MUSIC Standalone IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
            echo "DEVELOPER_DIR=$XCODE_16/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Node Environment for Xcode
        run: |
          NODE_PATH=$(which node)
          echo "Node found at $NODE_PATH"
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node || true
          mkdir -p ~/.nvm
          echo "export NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Patch Expo Modules for Xcode 16 Compatibility
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function fixPackageSwift(dir) {
              try {
                for (const f of fs.readdirSync(dir)) {
                  const full = path.join(dir, f);
                  if (fs.statSync(full).isDirectory()) fixPackageSwift(full);
                  else if (f === 'Package.swift') {
                    let content = fs.readFileSync(full, 'utf8');
                    if (content.includes('swift-tools-version: 6.2')) {
                      content = content.replace(/swift-tools-version:\s*6\.2/g, 'swift-tools-version: 6.0');
                      fs.writeFileSync(full, content, 'utf8');
                      console.log('Fixed swift-tools-version to 6.0 in:', full);
                    }
                  }
                }
              } catch(e) {}
            }
            fixPackageSwift('node_modules');

            const rsPath = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h';
            if (fs.existsSync(rsPath)) {
              let c = fs.readFileSync(rsPath, 'utf8');
              c = c.replace(/SWIFT_RETURNS_RETAINED /g, '').replace(/ SWIFT_RETURNS_RETAINED/g, '');
              fs.writeFileSync(rsPath, c, 'utf8');
              console.log('Successfully patched RuntimeScheduler.h');
            }
            const scriptPath = 'node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh';
            if (fs.existsSync(scriptPath)) {
              let c = fs.readFileSync(scriptPath, 'utf8');
              c = c.replace(/-quiet \\\\/g, '\\\\');
              fs.writeFileSync(scriptPath, c, 'utf8');
              console.log('Successfully unmuted build-xcframework.sh');
            }
          "

      - name: Generate Native iOS Xcode Workspace
        run: |
          echo "CocoaPods path and version:"
          which pod
          pod --version
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install > pod_install.log 2>&1 || (cat pod_install.log && exit 1)
          cd ..
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pbxprojDir = fs.readdirSync('ios').find(f => f.endsWith('.xcodeproj'));
            if (pbxprojDir) {
              const filePath = path.join('ios', pbxprojDir, 'project.pbxproj');
              let content = fs.readFileSync(filePath, 'utf8');
              content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
              content = content.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
              fs.writeFileSync(filePath, content, 'utf8');
              console.log('Successfully forced Manual code signing on project.pbxproj');
            }
          "

      - name: Compile Native iOS Application (Unsigned)
        run: |
          cd ios
          echo "Listing available schemes and workspaces:"
          xcodebuild -list
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          xcodebuild clean build \
                     -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_STYLE="Manual" \
                     DEVELOPMENT_TEAM="" > xcodebuild.log 2>&1 || (cat xcodebuild.log | grep -E "error:|fatal error:" -B 2 -A 5 | head -n 100 && exit 1)

      - name: Push Diagnostics and Logs on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B debug-log
          echo "=== DIAGNOSTICS ===" > debug_info.txt
          pwd >> debug_info.txt
          ls -la >> debug_info.txt
          if [ -d "ios" ]; then
            echo "=== IOS DIR ===" >> debug_info.txt
            ls -la ios/ >> debug_info.txt
          fi
          if [ -f "ios/pod_install.log" ]; then
            echo "=== POD INSTALL LOG ===" >> debug_info.txt
            tail -n 200 ios/pod_install.log >> debug_info.txt
          fi
          if [ -f "ios/xcodebuild.log" ]; then
            echo "=== XCODEBUILD LOG ===" >> debug_info.txt
            tail -n 2500 ios/xcodebuild.log >> debug_info.txt
          fi
          git add debug_info.txt
          git commit -m "debug: full failure diagnostics"
          git push -f origin debug-log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/xcodebuild.log

      - name: Package Standalone .ipa
        run: |
          mkdir -p Payload
          find ios/build -name "*.app" -type d -exec cp -r {} Payload/ \;
          ls -la Payload/
          zip -r -y DEV_MUSIC.ipa Payload

      - name: Upload Standalone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DEV_MUSIC_IPA
          path: DEV_MUSIC.ipa
          retention-days: 7
