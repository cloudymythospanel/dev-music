name: Build DEV MUSIC Standalone IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Xcode Workspace
        run: |
          npx expo prebuild --platform ios --clean
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pbxprojDir = fs.readdirSync('ios').find(f => f.endsWith('.xcodeproj'));
            if (pbxprojDir) {
              const filePath = path.join('ios', pbxprojDir, 'project.pbxproj');
              let content = fs.readFileSync(filePath, 'utf8');
              content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
              content = content.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
              fs.writeFileSync(filePath, content, 'utf8');
              console.log('Successfully forced Manual code signing on project.pbxproj');
            }
          "

      - name: Compile Native iOS Application (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
          xcodebuild clean build \
                     -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_STYLE="Manual" \
                     DEVELOPMENT_TEAM=""

      - name: Package Standalone .ipa
        run: |
          mkdir -p Payload
          find ios/build -name "*.app" -type d -exec cp -r {} Payload/ \;
          ls -la Payload/
          zip -r -y DEV_MUSIC.ipa Payload

      - name: Upload Standalone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DEV_MUSIC_IPA
          path: DEV_MUSIC.ipa
          retention-days: 7
