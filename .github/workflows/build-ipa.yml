name: Build DEV MUSIC Standalone IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Generate Native iOS Xcode Workspace
        run: |
          NODE_PATH=$(which node)
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node || true
          echo "NODE_BINARY=$NODE_PATH" >> $GITHUB_ENV

          echo "CocoaPods version:"
          pod --version

          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install

          cd ios
          pod install > pod_install.log 2>&1 || (cat pod_install.log && exit 1)
          cd ..

          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          node -e "
            const fs = require('fs');
            const path = require('path');
            const pbxprojDir = fs.readdirSync('ios').find(f => f.endsWith('.xcodeproj'));
            if (pbxprojDir) {
              const filePath = path.join('ios', pbxprojDir, 'project.pbxproj');
              let content = fs.readFileSync(filePath, 'utf8');
              content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
              content = content.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
              fs.writeFileSync(filePath, content, 'utf8');
              console.log('Forced Manual code signing.');
            }
          "

      - name: Compile Native iOS Application (Unsigned)
        run: |
          cd ios
          xcodebuild -list
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild build \
                     -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_STYLE="Manual" \
                     DEVELOPMENT_TEAM="" \
            > xcodebuild.log 2>&1 || (grep -E "error:|fatal error:" xcodebuild.log | head -n 80 && exit 1)

      - name: Push Diagnostics on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B debug-log
          {
            echo "=== DIAGNOSTICS ==="
            pwd
            ls -la
            if [ -d "ios" ]; then
              echo "=== IOS DIR ==="
              ls -la ios/
            fi
            if [ -f "ios/pod_install.log" ]; then
              echo "=== POD INSTALL LOG (last 200) ==="
              tail -n 200 ios/pod_install.log
            fi
            if [ -f "ios/xcodebuild.log" ]; then
              echo "=== XCODEBUILD ERRORS ==="
              grep -C 10 "error:" ios/xcodebuild.log | head -n 200 || true
              echo "=== XCODEBUILD TAIL ==="
              tail -n 100 ios/xcodebuild.log
            fi
          } > debug_info.txt 2>&1
          git add debug_info.txt
          git commit -m "debug: failure diagnostics"
          git push -f origin debug-log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/xcodebuild.log

      - name: Package Standalone .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Found app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y DEV_MUSIC.ipa Payload

      - name: Upload Standalone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DEV_MUSIC_IPA
          path: DEV_MUSIC.ipa
          retention-days: 7
