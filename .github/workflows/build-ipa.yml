name: Build DEV MUSIC Standalone IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Native iOS Xcode Workspace
        run: npx expo prebuild --platform ios --clean

      - name: Compile Native iOS Application (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace DEV_MUSIC.xcworkspace \
                     -scheme DEV_MUSIC \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/DEV_MUSIC.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive

      - name: Package Standalone .ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/DEV_MUSIC.xcarchive/Products/Applications/*.app Payload/
          zip -r -y DEV_MUSIC.ipa Payload

      - name: Upload Standalone .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DEV_MUSIC_IPA
          path: DEV_MUSIC.ipa
          retention-days: 7
